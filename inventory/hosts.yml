---
all:
  children:
    openwrt:
      hosts:
        main-router:
          ansible_host: 192.168.1.1
          ansible_user: root
          ansible_connection: ssh
          ansible_become: false
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@100.122.224.81"'
          ansible_python_interpreter: auto_silent
      vars:
        ansible_module_interpreter: auto

    proxmox:
      hosts:
        pve-host:
          ansible_host: 100.122.224.81
          ansible_user: root
          ansible_connection: ssh
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
      vars:
        ansible_python_interpreter: /usr/bin/python3

    # Future expansion groups
    # access_points:
    # nas:
    # linux_servers: