[defaults]
inventory = ./inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
# callback_whitelist = timer, profile_tasks  # deprecated in ansible-core 2.13+
interpreter_python = auto_silent
collections_paths = ~/.ansible/collections:/usr/share/ansible/collections
deprecation_warnings = False

[ssh_connection]
ssh_args = -o ControlMaster=no -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
# control_path = ~/.ansible/cp/%%h-%%r
# ssh_executable = /tmp/ansible_ssh_wrapper.sh  # Per-host in inventory

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[galaxy]
server = https://galaxy.ansible.com