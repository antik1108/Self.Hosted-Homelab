---
- name: Configure default firewall settings
  openwrt.uci:
    config: firewall
    section: defaults
    type: defaults
    values:
      input: "{{ firewall.defaults.input }}"
      output: "{{ firewall.defaults.output }}"
      forward: "{{ firewall.defaults.forward }}"
      synflood_protect: "{{ firewall.synflood_protect | lower }}"
      flow_offloading: "1"
      flow_offloading_hw: "0"
  notify: reload firewall

- name: Configure LAN zone
  openwrt.uci:
    config: firewall
    section: lan
    type: zone
    values:
      name: "lan"
      input: "{{ firewall_zones[0].input }}"
      output: "{{ firewall_zones[0].output }}"
      forward: "{{ firewall_zones[0].forward }}"
      network: "{{ firewall_zones[0].network }}"
  notify: reload firewall

- name: Configure WAN zone
  openwrt.uci:
    config: firewall
    section: wan
    type: zone
    values:
      name: "wan"
      input: "{{ firewall_zones[1].input }}"
      output: "{{ firewall_zones[1].output }}"
      forward: "{{ firewall_zones[1].forward }}"
      masq: "{{ firewall_zones[1].masq | lower }}"
      mtu_fix: "{{ firewall_zones[1].mtu_fix | lower }}"
      network: "{{ firewall_zones[1].network }}"
  notify: reload firewall

- name: Configure LAN to WAN forwarding
  openwrt.uci:
    config: firewall
    section: lan_wan
    type: forwarding
    values:
      src: "lan"
      dest: "wan"
  notify: reload firewall

- name: Configure port forwards
  openwrt.uci:
    config: firewall
    section: "{{ item.name }}"
    type: redirect
    values:
      src: "{{ item.src }}"
      src_dport: "{{ item.src_dport }}"
      dest: "{{ item.dest }}"
      dest_ip: "{{ item.dest_ip }}"
      dest_port: "{{ item.dest_port }}"
      proto: "{{ item.proto }}"
      name: "{{ item.name }}"
  loop: "{{ port_forwards | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  notify: reload firewall
  when: port_forwards is defined

- name: Allow established/related traffic
  openwrt.uci:
    config: firewall
    section: allow_established
    type: rule
    values:
      name: "Allow-Established"
      src: "wan"
      dest: "lan"
      proto: "all"
      ctstate: "ESTABLISHED,RELATED"
      target: "ACCEPT"
  notify: reload firewall

- name: Allow DHCPv6 from WAN
  openwrt.uci:
    config: firewall
    section: allow_dhcpv6
    type: rule
    values:
      name: "Allow-DHCPv6"
      src: "wan"
      proto: "udp"
      src_port: "547"
      dest_port: "546"
      family: "ipv6"
      target: "ACCEPT"
  notify: reload firewall

- name: Allow ICMPv6
  openwrt.uci:
    config: firewall
    section: allow_icmpv6
    type: rule
    values:
      name: "Allow-ICMPv6"
      src: "wan"
      proto: "icmp"
      family: "ipv6"
      target: "ACCEPT"
  notify: reload firewall